<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>奇幻島 雲端智能機器人 (多車低延遲版)</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body { text-align: center; font-family: -apple-system, sans-serif; background-color: #f4f6f9; margin: 0; padding: 10px; }
        
        .title-container { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 10px 0; }
        .title-container img { width: 100px; height: 100px; object-fit: cover; border-radius: 50%; border: 3px solid #007bff; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { color: #333; margin: 0; font-size: 22px; }
        
        .bt-card { background: white; max-width: 480px; margin: 5px auto 15px auto; padding: 12px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
        #status { font-size: 15px; color: #d9534f; font-weight: bold; }

        .car-selector-container { background: #e3f2fd; padding: 12px; border-radius: 10px; margin-top: 10px; border: 2px solid #90caf9; }
        .car-selector-container select { font-size: 16px; padding: 8px 15px; border-radius: 8px; border: 1px solid #64b5f6; font-weight: bold; color: #1565c0; outline: none; margin-left: 10px;}

        .group-title { font-size: 15px; font-weight: bold; color: #555; margin-bottom: 8px; display: block; }

        .speed-container, .voice-container { background: white; border-radius: 12px; padding: 12px; margin-bottom: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); max-width: 480px; margin-left: auto; margin-right: auto;}
        .speed-btn-group { display: flex; justify-content: center; gap: 15px; }
        .speed-btn { flex: 1; font-size: 18px; font-weight: bold; padding: 12px; background-color: #e9ecef; color: #495057; border: 2px solid #ced4da; border-radius: 10px; cursor: pointer; transition: all 0.2s; }
        .speed-btn.active { background-color: #007bff; color: white; border-color: #0056b3; }

        .radar-container { background: #051a05; border-radius: 12px; padding: 15px 10px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); color: #00ff00; max-width: 480px; margin-left: auto; margin-right: auto;}
        .radar-container .group-title { color: #00ff00; }
        #radarCanvas { background-color: transparent; display: block; margin: 0 auto; filter: drop-shadow(0 0 5px rgba(0,255,0,0.3)); }
        #radarDist { margin-top: 10px; font-size: 14px; font-weight: bold;}

        .mode-container { margin-bottom: 15px; width: 100%; max-width: 480px; margin-left: auto; margin-right: auto;}
        .btn-auto { font-size: 18px; font-weight: bold; padding: 12px; width: 100%; background-color: #ffc107; color: #333; border: 2px solid #e0a800; border-radius: 15px; cursor: pointer; }
        .btn-auto.active { background-color: #28a745; color: white; border-color: #1e7e34; }

        .btn-mic { font-size: 18px; font-weight: bold; padding: 15px; width: 100%; background-color: #e91e63; color: white; border: 2px solid #c2185b; border-radius: 15px; cursor: pointer; transition: all 0.2s ease; }
        .btn-mic.recording { background-color: #ff1744; border-color: #d50000; animation: pulse 1.2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
        #voiceResult { margin-top: 8px; font-size: 15px; font-weight: bold; color: #007bff; }

        .joystick-container { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 480px; margin-left: auto; margin-right: auto; padding: 0 5px; }
        .stick-group { display: flex; flex-direction: column; gap: 12px; align-items: center; }
        .stick-row { display: flex; gap: 10px; }
        .d-btn { font-size: 32px; background-color: #ffffff; border: 2px solid #b8c2cc; border-radius: 18px; cursor: pointer; width: 72px; height: 72px; box-shadow: 0 4px 8px rgba(0,0,0,0.08); display: flex; justify-content: center; align-items: center; }
        .d-btn:active { background-color: #d1e7dd; border-color: #198754; transform: scale(0.93); }
        .btn-stop { background-color: #ff4d4d; border: 2px solid #d93838; color: white; font-size: 18px; font-weight: bold; width: 154px; height: 50px; border-radius: 15px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="title-container">
        <img src="LOGO.jpg" alt="奇幻島標誌" onclick="unlockAudio()">
        <h2>奇幻島 雲端智能機器人</h2>
    </div>

    <div class="bt-card">
        <div id="status">☁️ 正在連線至 MQTT 雲端...</div>
        <div class="car-selector-container">
            <label style="font-weight: bold; color: #1565c0;">📍 控制目標：</label>
            <select id="carIdSelect" onchange="changeCarId()">
                <option value="01">01 號車</option>
                <option value="02">02 號車</option>
                <option value="03">03 號車</option>
                <option value="04">04 號車</option>
                <option value="05">05 號車</option>
            </select>
        </div>
    </div>

    <div id="controls">
        <div class="speed-container">
            <span class="group-title">【 行駛檔位 】</span>
            <div class="speed-btn-group">
                <button id="speed2" class="speed-btn active" onclick="setSpeed(2)">🚗 一般</button>
                <button id="speed3" class="speed-btn" onclick="setSpeed(3)">🚀 快</button>
            </div>
        </div>

        <div class="radar-container">
            <span class="group-title">【 超音波環境掃描雷達 】</span>
            <canvas id="radarCanvas" width="280" height="150"></canvas>
            <div id="radarDist">✅ 啟動掃描中...</div>
        </div>

        <div class="mode-container">
            <button id="autoBtn" class="btn-auto active" onclick="toggleAutoMode()">🤖 自動避障中 (點擊關閉)</button>
        </div>

        <div class="voice-container">
            <span class="group-title">【 ⚡極低延遲連續語音遙控 】</span>
            <button id="btnMic" class="btn-mic" onclick="toggleVoice()">🎤 點擊開始語音控制</button>
            <div id="voiceResult">等待語音指令...</div>
        </div>

        <div class="joystick-container">
            <div class="stick-group">
                <span class="group-title">【 前後 】</span>
                <button class="d-btn" onpointerdown="sendCmd('F')" onpointerup="sendCmd('S')" onpointerleave="sendCmd('S')">⬆️</button>
                <button class="d-btn" onpointerdown="sendCmd('B')" onpointerup="sendCmd('S')" onpointerleave="sendCmd('S')">⬇️</button>
            </div>
            <div class="stick-group">
                <span class="group-title">【 轉向 / 停止 】</span>
                <button class="btn-stop" onclick="sendCmd('S')">🛑 緊急煞車</button>
                <div class="stick-row">
                    <button class="d-btn" onpointerdown="sendCmd('L')" onpointerup="sendCmd('S')" onpointerleave="sendCmd('S')">⬅️</button>
                    <button class="d-btn" onpointerdown="sendCmd('R')" onpointerup="sendCmd('S')" onpointerleave="sendCmd('S')">➡</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const MQTT_BROKER = "wss://broker.emqx.io:8084/mqtt";
        const CLIENT_ID = 'web_' + Math.random().toString(16).substr(2, 8);
        
        let currentCarId = "01";
        let TOPIC_CMD = `fantasy/robot${currentCarId}/cmd`;
        let TOPIC_RADAR = `fantasy/robot${currentCarId}/radar`;
        
        let client = mqtt.connect(MQTT_BROKER, { clientId: CLIENT_ID });
        let isAutoMode = true;
        let lastContinuousCmd = 'S';
        let audioUnlocked = false;

        client.on('connect', function () {
            document.getElementById('status').innerText = '狀態：🟢 雲端連線成功！可以開始遙控';
            document.getElementById('status').style.color = '#198754';
            client.subscribe(TOPIC_RADAR);
        });

        client.on('message', function (topic, message) {
            if (topic === TOPIC_RADAR) {
                let dataStr = message.toString();
                if(dataStr.startsWith("R:")) {
                    let data = dataStr.substring(2).split(",");
                    if(data.length === 2) {
                        let ang = parseInt(data[0]);
                        let dist = parseInt(data[1]);
                        if (dist < 100 && dist > 0) obstacleMemory[ang] = { dist: dist, time: Date.now() };
                    }
                }
            }
        });

        function changeCarId() {
            client.unsubscribe(TOPIC_RADAR);
            currentCarId = document.getElementById('carIdSelect').value;
            TOPIC_CMD = `fantasy/robot${currentCarId}/cmd`;
            TOPIC_RADAR = `fantasy/robot${currentCarId}/radar`;
            client.subscribe(TOPIC_RADAR);
            obstacleMemory = {};
            document.getElementById('radarDist').innerText = `✅ 已成功切換至 ${currentCarId} 號車連線`;
            sendCmd('S');
        }

        function sendCmd(cmd) {
            if (cmd === 'F' || cmd === 'B' || cmd === 'S') lastContinuousCmd = cmd;
            if (cmd !== 'A' && isAutoMode) {
                isAutoMode = false;
                document.getElementById('autoBtn').classList.remove('active');
                document.getElementById('autoBtn').innerText = '🤖 切換自動避障 (關閉)';
            }
            client.publish(TOPIC_CMD, cmd);
        }

        function toggleAutoMode() {
            isAutoMode = !isAutoMode;
            const autoBtn = document.getElementById('autoBtn');
            if (isAutoMode) {
                autoBtn.classList.add('active'); autoBtn.innerText = '🤖 自動避障中 (點擊關閉)'; sendCmd('A');
                speakOut("啟動自動避障");
            } else {
                autoBtn.classList.remove('active'); autoBtn.innerText = '🤖 切換自動避障 (關閉)'; sendCmd('S');
                speakOut("關閉自動避障");
            }
        }

        function setSpeed(level) {
            document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('speed' + level).classList.add('active');
            sendCmd('V' + level);
        }

        function unlockAudio() {
            if (!audioUnlocked && 'speechSynthesis' in window) {
                window.speechSynthesis.speak(new SpeechSynthesisUtterance(""));
                audioUnlocked = true;
            }
        }

        function speakOut(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-TW';
                utterance.rate = 1.3; 
                utterance.pitch = 1.2; 
                window.speechSynthesis.speak(utterance);
            }
        }

        // ==========================================
        // 🌟 核心升級：電競級即時語音辨識
        // ==========================================
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isListening = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'zh-TW';
            recognition.continuous = true; 
            
            // 🌟 關鍵 1：開啟「即時回傳 (interimResults)」，不等一句話講完就先丟字出來！
            recognition.interimResults = true; 

            recognition.onresult = (event) => {
                // 取得從剛才到現在的所有最新字串
                let text = "";
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    text += event.results[i][0].transcript;
                }
                text = text.trim();
                if (!text) return;

                document.getElementById('voiceResult').innerText = "⚡即時攔截：" + text;
                let commandMatched = false;

                if (text.includes("前進") || text.includes("往前") || text.includes("走")) {
                    sendCmd('F'); speakOut("衝啊！"); commandMatched = true;
                }
                else if (text.includes("後退") || text.includes("倒車")) {
                    sendCmd('B'); speakOut("巴庫巴庫"); commandMatched = true;
                }
                else if (text.includes("左轉")) {
                    sendCmd('L'); speakOut("向左轉"); commandMatched = true;
                    setTimeout(() => { sendCmd(lastContinuousCmd); }, 500);
                }
                else if (text.includes("右轉")) {
                    sendCmd('R'); speakOut("向右轉"); commandMatched = true;
                    setTimeout(() => { sendCmd(lastContinuousCmd); }, 500);
                }
                else if (text.includes("停") || text.includes("煞車")) {
                    sendCmd('S'); speakOut("緊急煞車"); commandMatched = true;
                }
                else if (text.includes("避障") || text.includes("自動")) {
                    if (!isAutoMode) toggleAutoMode(); commandMatched = true;
                }

                // 🌟 關鍵 2：只要命中指令，就「立刻把麥克風停止並瞬間重啟」！
                // 這樣能強制清空舊字串，避免連續觸發，且下次講話依舊是零延遲。
                if (commandMatched) {
                    recognition.stop();
                }
            };

            recognition.onend = () => {
                // 只要開關還是亮著的，就無限瞬間重啟，達到無縫接軌
                if(isListening) recognition.start(); 
            };
        }

        function toggleVoice() {
            unlockAudio();
            if (!recognition) return alert("您的瀏覽器不支援語音辨識");
            const btn = document.getElementById('btnMic');
            if (!isListening) {
                recognition.start();
                isListening = true;
                btn.classList.add('recording');
                btn.innerText = "🎙️ ⚡極低延遲聆聽中...";
                speakOut("即時語音已啟動");
            } else {
                isListening = false;
                recognition.stop();
                btn.classList.remove('recording');
                btn.innerText = "🎤 點擊開始語音控制";
                speakOut("語音已關閉");
            }
        }

        const canvas = document.getElementById('radarCanvas');
        const ctx = canvas.getContext('2d');
        const radarRadius = 130; const centerX = canvas.width / 2; const centerY = canvas.height - 10;
        let displayAngle = 0; let scanDirection = 1; let obstacleMemory = {};    
        
        function renderRadarLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath(); ctx.arc(centerX, centerY, radarRadius, Math.PI, 0); ctx.fillStyle = 'rgba(0, 30, 0, 0.8)'; ctx.fill();
            ctx.strokeStyle = 'rgba(0, 180, 0, 0.5)'; ctx.lineWidth = 1;
            for(let i=1; i<=3; i++) { ctx.beginPath(); ctx.arc(centerX, centerY, radarRadius * (i/3), Math.PI, 0); ctx.stroke(); }
            displayAngle += scanDirection * 1.5; 
            if (displayAngle >= 180) { displayAngle = 180; scanDirection = -1; }
            if (displayAngle <= 0) { displayAngle = 0; scanDirection = 1; }
            let currentRad = (180 - displayAngle) * Math.PI / 180;
            ctx.beginPath(); ctx.moveTo(centerX, centerY); ctx.arc(centerX, centerY, radarRadius, currentRad, currentRad + (scanDirection * 0.35), scanDirection === -1); ctx.lineTo(centerX, centerY); ctx.fillStyle = 'rgba(0, 255, 0, 0.25)'; ctx.fill();
            ctx.beginPath(); ctx.moveTo(centerX, centerY); ctx.lineTo(centerX + Math.cos(currentRad) * radarRadius, centerY - Math.sin(currentRad) * radarRadius); ctx.strokeStyle = '#00ff00'; ctx.lineWidth = 2; ctx.stroke();

            let now = Date.now(); let activeWarnings = [];
            for (let ang in obstacleMemory) {
                let b = obstacleMemory[ang]; let age = now - b.time;
                if (age < 2500) {
                    let r = (180 - parseInt(ang)) * Math.PI / 180; let distRatio = Math.min(b.dist / 100, 1); 
                    ctx.beginPath(); ctx.arc(centerX + Math.cos(r) * radarRadius * distRatio, centerY - Math.sin(r) * radarRadius * distRatio, 6, 0, Math.PI*2);
                    ctx.fillStyle = `rgba(255, ${parseInt(ang) === 90 ? 0 : 100}, 0, ${1.0 - (age / 2500)})`; ctx.fill();
                    activeWarnings.push(`${parseInt(ang) === 90 ? "前方" : (parseInt(ang) === 150 ? "左方" : "右方")}${b.dist}cm`);
                }
            }
            if (!document.getElementById('radarDist').innerText.includes("已成功切換")) {
                document.getElementById('radarDist').innerText = activeWarnings.length > 0 ? "⚠️ 障礙: " + activeWarnings.join(" | ") : "✅ 周圍安全 (掃描中...)";
                document.getElementById('radarDist').style.color = activeWarnings.length > 0 ? '#ff4d4d' : '#00ff00';
            }
            requestAnimationFrame(renderRadarLoop);
        }
        renderRadarLoop();
    </script>
</body>
</html>
